name: Update Podcast Feed

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - run: python3 emess_rss.py

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add feed.xml state.json
          git diff --staged --quiet || git commit -m "Update podcast feed"
          git push
