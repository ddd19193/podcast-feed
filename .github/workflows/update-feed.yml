name: Update Podcast Feed
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: podcast-feed-update
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests cloudscraper

      - run: python3 emess_rss.py
        continue-on-error: true
      - run: python3 emess_rss_527.py
        continue-on-error: true
      - run: python3 emess_rss_453.py
        continue-on-error: true
      - run: python3 emess_rss_394.py
        continue-on-error: true
      - run: python3 emess_rss_455.py
        continue-on-error: true
      - run: python3 emess_rss_452.py
        continue-on-error: true
      - run: python3 emess_rss_421.py
        continue-on-error: true
      - run: python3 emess_rss_447.py
        continue-on-error: true
      - run: python3 emess_rss_506.py
        continue-on-error: true
      - run: python3 emess_rss_53359.py
        continue-on-error: true
      - run: python3 kolbarama_rss_800.py
        continue-on-error: true
      - run: python3 kolbarama_rss_hadvechelek.py
        continue-on-error: true
      - run: python3 kolbarama_rss_tzeithakochavim.py
        continue-on-error: true
      - run: python3 kolbarama_rss_laylamenatzeach.py
        continue-on-error: true
      - run: python3 kolbarama_rss_chidudon.py
        continue-on-error: true
      - run: python3 kolbarama_rss_hamehadura.py
        continue-on-error: true
      - run: python3 doscast_rss_430.py
        continue-on-error: true
      - run: python3 doscast_rss_121.py
        continue-on-error: true
      - run: python3 doscast_rss_489.py
        continue-on-error: true
      - run: python3 doscast_rss_485.py
        continue-on-error: true
      - run: python3 doscast_rss_461.py
        continue-on-error: true
      - run: python3 doscast_rss_448.py
        continue-on-error: true
      - run: python3 doscast_rss_438.py
        continue-on-error: true
      - run: python3 doscast_rss_419.py
        continue-on-error: true
      - run: python3 doscast_rss_188.py
        continue-on-error: true
      - run: python3 doscast_rss_465.py
        continue-on-error: true
      - run: python3 doscast_rss_475.py
        continue-on-error: true
      - run: python3 doscast_rss_308.py
        continue-on-error: true
      - run: python3 doscast_rss_298.py
        continue-on-error: true
      - run: python3 doscast_rss_257.py
        continue-on-error: true
      - run: python3 doscast_rss_97.py
        continue-on-error: true
      - run: python3 doscast_rss_447.py
        continue-on-error: true
      - run: python3 kolhalashon_rss_4859.py
        continue-on-error: true
      - run: python3 amistory_rss.py
        continue-on-error: true
      - run: python3 halomot_rss_67.py
        continue-on-error: true
      - run: python3 pneimelech_rss.py
        continue-on-error: true
      - run: python3 achiyayeda_rss.py
        continue-on-error: true
      - run: python3 kolhalashon_rss_1920.py
        continue-on-error: true

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          FILES="feed.xml state.json feed_527.xml state_527.json feed_453.xml state_453.json feed_394.xml state_394.json feed_455.xml state_455.json feed_452.xml state_452.json feed_421.xml state_421.json feed_447.xml state_447.json feed_506.xml state_506.json feed_53359.xml state_53359.json feed_kolbarama_800.xml state_kolbarama_800.json feed_kolbarama_hadvechelek.xml state_kolbarama_hadvechelek.json feed_kolbarama_tzeithakochavim.xml state_kolbarama_tzeithakochavim.json feed_kolbarama_laylamenatzeach.xml state_kolbarama_laylamenatzeach.json feed_kolbarama_chidudon.xml state_kolbarama_chidudon.json feed_kolbarama_hamehadura.xml state_kolbarama_hamehadura.json feed_doscast_430.xml state_doscast_430.json feed_doscast_121.xml state_doscast_121.json feed_doscast_489.xml state_doscast_489.json feed_doscast_485.xml state_doscast_485.json feed_doscast_461.xml state_doscast_461.json feed_doscast_448.xml state_doscast_448.json feed_doscast_438.xml state_doscast_438.json feed_doscast_419.xml state_doscast_419.json feed_doscast_188.xml state_doscast_188.json feed_doscast_465.xml state_doscast_465.json feed_doscast_475.xml state_doscast_475.json feed_doscast_308.xml state_doscast_308.json feed_doscast_298.xml state_doscast_298.json feed_doscast_257.xml state_doscast_257.json feed_doscast_97.xml state_doscast_97.json feed_doscast_447.xml state_doscast_447.json feed_kolhalashon_4859.xml state_kolhalashon_4859.json feed_amistory.xml feed_halomot_67.xml state_halomot_67.json feed_pneimelech.xml state_pneimelech.json feed_achiyayeda.xml state_achiyayeda.json feed_kolhalashon_1920.xml state_kolhalashon_1920.json"
          for f in $FILES; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          git diff --staged --quiet || git commit -m "Update podcast feeds"
          git fetch origin main
          git merge -X ours origin/main --no-edit
          git push
